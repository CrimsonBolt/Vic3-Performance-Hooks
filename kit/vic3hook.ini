; vic3hook cadence config - stamp set per release by scripts/make_kit.py
; hot-reloads every 5 s. every_n: 0=off, 1=always, N=work on every Nth call.
; All six proven tasks run every tick in vanilla; the defaults throttle five
; of them to every OTHER tick - the gentlest setting. Raise N for more speed
; (and more gameplay skew); lower to 1 or 0 for vanilla behavior.
; vanilla_day_every_n_days: every Nth day ALL throttled tasks run at full
; fidelity for that day - a scheduled resync that keeps day-phased AI
; systems (war resolution, construction) healthy. 7 = one vanilla day per
; week (default); 0 disables it.
; RecalculateModifierNodes is shipped DISABLED on purpose: it is the single
; biggest late-game cost, but skipping it defers modifier invalidations and
; silently breaks one-shot decisions (e.g. diplomatic deals show 100% valid
; but never apply - isolated and confirmed 2026-10-16). Leave it at 0.
; ProcessEconomicMigration / UpdateAICountryGoalsAdjustments (NEW, default
; 0 = vanilla): the next experiment. Both were verified skip-safe in the
; code (migration is a queue - a skipped day just delays it; AI goal
; adjustments carry a progress cursor). Flip to 2 (every other day) to test;
; expect roughly 1-2 ms/tick back late game.
; render_frame_if_needed (NEW, default 1 = game default): set to 0 to apply
; the engine's own -disable_renderframeifneeded switch (console cvar
; GameStateTick.RenderFrameIfNeeded) - sub-tick rendering is sacrificed for
; tick speed. Sim results are unaffected. UI may feel less smooth at high
; speed; back to 1 takes effect after a game restart.
[hooks]
vanilla_day_every_n_days=7
PrepareNavyAIData_every_n=2
UpdateBuildingSpendingPriorities_Stage2_every_n=2
UpdateAI_every_n=2
HandleAutonomousInvestment_every_n=2
UpdateSpendingVariables_every_n=2
RecalculateModifierNodes_every_n=0
ProcessEconomicMigration_every_n=0
UpdateAICountryGoalsAdjustments_every_n=0
render_frame_if_needed=1
