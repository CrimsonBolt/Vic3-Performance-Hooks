; vic3hook cadence config - stamp set per release by scripts/make_kit.py
; hot-reloads every 5 s. every_n: 0=off (never installed), 1=always, N=work on
; every Nth call. The 1.15.0.1 BETA ships ALL EIGHT hooks enabled, at the
; profile live-tested on Victoria 3 1.15.0 (rev 63385479): the seven
; every-tick heavyweights at every-2, RecalculateModifierNodes at every-5
; (the cadence proven across the 1.14.x sessions). Raise N for more speed
; (and more gameplay skew); set 1 or 0 for vanilla behavior.
; vanilla_day_every_n_days: every Nth day ALL throttled tasks run at full
; fidelity for that day - a scheduled resync that keeps day-phased AI
; systems (war resolution, construction) healthy. 7 = one vanilla day per
; week (default); 0 disables it.
; RecalculateModifierNodes (beta default 5): throttled modifier invalidation
; is the single biggest late-game win. A 2026-10-16 test blamed it for
; one-shot diplomatic deals not applying, but the diplo-wedge autopsy later
; reproduced deal failure with hooks OFF on a corrupted vanilla save and the
; isolation was retracted. Watch deal behavior; set 0 (passthrough, no
; restart) to isolate if anything looks off.
; ProcessEconomicMigration / UpdateAICountryGoalsAdjustments (beta default 2):
; verified skip-safe in the code (migration is a queue - a skipped day just
; delays it; AI goal adjustments carry a progress cursor).
; render_frame_if_needed (default 1 = game default): set to 0 to apply the
; engine's own -disable_renderframeifneeded switch (console cvar
; GameStateTick.RenderFrameIfNeeded) - sub-tick rendering is sacrificed for
; tick speed. Sim results are unaffected. UI may feel less smooth at high
; speed; back to 1 takes effect after a game restart.
[hooks]
vanilla_day_every_n_days=7
PrepareNavyAIData_every_n=2
UpdateBuildingSpendingPriorities_Stage2_every_n=2
UpdateAI_every_n=2
HandleAutonomousInvestment_every_n=2
UpdateSpendingVariables_every_n=2
RecalculateModifierNodes_every_n=5
ProcessEconomicMigration_every_n=2
UpdateAICountryGoalsAdjustments_every_n=2
render_frame_if_needed=1
