; vic3hook cadence config (Victoria 3 1.14.5) - SAFE PROFILE (kit 1.14.5.3)
; hot-reloads every 5 s. every_n: 0=off, 1=always, N=work on every Nth call.
; All six tasks run every tick in vanilla; the defaults throttle each to
; every OTHER tick - the gentlest setting. Raise N for more speed (and more
; gameplay skew); lower to 1 or 0 for vanilla behavior.
[hooks]
